<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <title>Login</title>
</head>
<body>
    <main class="rejilla col-10">
        <section class="contenedor-login col-12">
            <article class="contenedor-tarjeta tarjeta-login">
                <header class="columna-flexible">
                    <h1 class="texto-titulo">VetCare - Clinica Huellitas</h1>
                    <h2 class="texto-subtitulo">Acceso al sistema</h2>
                </header>

                <form class="columna-flexible" method="get">
                    <fieldset>
                        <legend>Credenciales de acceso</legend>
                        <div class="columna-flexible">
                            <label class="texto-etiqueta" for="correo">Correo electrónico</label>
                            <input id="correo" name="correo" type="email" required autocomplete="email" placeholder="usuario@huellitas.ec">
                        </div>

                        <div class="columna-flexible">
                            <label class="texto-etiqueta" for="contrasenia">Contraseña</label>
                            <input id="contrasenia" name="contrasenia" type="password" required minlength="6" autocomplete="current-password" placeholder="Mín. 6 caracteres">
                        </div>
                    </fieldset>
                        <div class="columna-flexible">
                            <button type="submit" class="btn-primario" formaction="pages/listado-citas.html">Acceder como Recepcionista</button>
                            <button type="submit" class="btn-secundario" formaction="pages/agenda-medica.html">Acceder como Veterinario</button>   
                            <button type="submit" class="btn-secundario" formaction="pages/gestion-veterinario.html">Acceder como Administrador</button>
                        </div>                    
                </form>
            </article>
        </section>
    </main>
    <footer class="fila-espaciada">
        <p class="texto-parrafo">VetCare · Clínica Veterinaria Huellitas · Quito</p>
        <p class="texto-subtitulo">&copy; 2026 VetCare. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
